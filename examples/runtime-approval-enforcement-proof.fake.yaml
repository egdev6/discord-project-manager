proof_boundary:
  proves:
    - synthetic write-like request stops at approval-requested before prompt execution or persistence
    - invalid approval input does not write
    - exact approve write stops at approval-verification-required pending server-side proposal binding
    - unmapped write-like route stops at needs-route without durable reads or writes
    - workspace filesystem Engram publishing and scheduling writes remain blocked
  does_not_prove:
    - live Discord gateway delivery
    - private Discord event ingestion
    - live OpenClaw prompt execution safety
    - server-side proposal binding
    - Engram write/readback
    - issue 211 completion
synthetic_probe_matrix:
  - id: matched-write-without-approval
    command_ref: docker/openclaw/discord-approval-guard.sh --route-status matched-route --request <write-like-request>
    expected_response_state: approval-requested
    expected_guard_event_type: guard-denial
    exact_approval_received: false
    prompt_execution: none
    persistent_writes_allowed: false
    workspace_file_writes_allowed: false
    memory_writes_allowed: false
    engram_writes_allowed: false
    writes_attempted: false
    durable_reads_allowed: true
  - id: matched-write-invalid-approval
    command_ref: docker/openclaw/discord-approval-guard.sh --route-status matched-route --request <write-like-request> --approval <invalid-approval>
    expected_response_state: approval-requested
    expected_guard_event_type: guard-invalid-approval
    exact_approval_received: false
    prompt_execution: none
    persistent_writes_allowed: false
    workspace_file_writes_allowed: false
    memory_writes_allowed: false
    engram_writes_allowed: false
    writes_attempted: false
    durable_reads_allowed: true
  - id: matched-write-exact-approval
    command_ref: docker/openclaw/discord-approval-guard.sh --route-status matched-route --request <write-like-request> --approval approve write --prior-proposal <proposal-ref>
    expected_response_state: approval-verification-required
    expected_guard_event_type: guard-approval-verification-required
    exact_approval_received: true
    prompt_execution: none
    persistent_writes_allowed: false
    workspace_file_writes_allowed: false
    memory_writes_allowed: false
    engram_writes_allowed: false
    writes_attempted: false
    durable_reads_allowed: true
    audit_required: true
  - id: unmapped-write-like-route
    command_ref: docker/openclaw/discord-approval-guard.sh --route-status unmapped-channel --request <write-like-request>
    expected_response_state: needs-route
    expected_guard_event_type: guard-needs-route
    exact_approval_received: false
    prompt_execution: none
    persistent_writes_allowed: false
    workspace_file_writes_allowed: false
    memory_writes_allowed: false
    engram_writes_allowed: false
    writes_attempted: false
    durable_reads_allowed: false
fail_closed_expectations:
  required_before_private_execution:
    - server-side proposal binding proof
    - private no-op observation path proof
    - private topology prepared outside repo
    - explicit human execution approval
    - sanitized execution/readback evidence review
  readiness_check_id: runtime-approval-enforcement
  current_readiness_status: design-only-not-implemented
  repo_safe_synthetic_status: synthetic-guard-cli-proven
  required_future_status: available-and-proven
  readiness_fixture_ref: examples/private-discord-engram-rehearsal-readiness.fake.yaml
  updates_readiness_fixture_now: false
sanitized_evidence_policy:
  allowed:
    - synthetic guard output summaries
    - validator command names and pass/fail summaries
    - placeholder namespace refs
    - blocked status summaries
  forbidden:
    - real Discord guild/channel/user/message IDs
    - credentials or .env values
    - screenshots
    - raw logs
    - transcripts
    - private payloads
    - raw Engram exports
    - SQL dumps
non_goals:
  - executing live Discord messages
  - executing an Engram write
  - executing a live readback from Engram
  - proving live private runtime approval enforcement
  - updating readiness to available-and-proven
  - closing issue 211
