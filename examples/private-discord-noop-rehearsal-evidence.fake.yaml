pre_execution_gates:
  - id: approval-guard-cli
    command_ref: bash scripts/validate-discord-approval-guard-cli.sh
    required_before_execution: true
    current_status: repo-contract-ready
  - id: noop-observation-cli
    command_ref: bash scripts/validate-discord-noop-observation-cli.sh
    required_before_execution: true
    current_status: repo-contract-ready
  - id: runtime-boundary-harness
    command_ref: bash scripts/validate-discord-runtime-boundary-harness.sh
    required_before_execution: true
    current_status: container-boundary-synthetic-ready
  - id: rehearsal-readiness
    command_ref: bash scripts/validate-private-discord-engram-rehearsal-readiness.sh
    required_before_execution: true
    current_status: blocked-until-explicit-approval
  - id: repo-safe-evidence
    command_ref: bash scripts/validate-repo-safe-evidence.sh
    required_before_execution: true
    current_status: required-pass-before-public-evidence
  - id: explicit-noop-execution-approval
    required_before_execution: true
    current_status: granted-for-noop-only
planned_evidence_policy:
  allowed:
    - pass status summary
    - blocked status summary
    - not-run status summary
    - placeholder namespace refs
    - validator command names and pass/fail summaries
    - sanitized no-op state table
    - explicit operator decision summary without identifiers
  forbidden:
    - real Discord guild/channel/user/role/message IDs
    - credentials or .env values
    - screenshots
    - raw logs
    - transcripts
    - private payloads
    - raw Engram exports
    - SQL dumps
    - backup archives
planned_no_op_boundaries:
  prompt_execution_allowed: false
  network_side_effects_allowed: false
  workspace_file_writes_allowed: false
  filesystem_writes_allowed: false
  durable_memory_writes_allowed: false
  engram_writes_allowed: false
  publishing_allowed: false
  scheduling_allowed: false
  github_mutations_allowed: false
current_summary:
  result_state: pass-summary
  reason: private no-op observation completed with summary-minimum evidence only
  observed_response_mode: response-only
  observed_operation: read
  observed_persistence_target: ephemeral
  observed_writeback_policy: reject
  writes_attempted: false
  live_discord_message: no-write-like-message-sent
  private_event_observation: pass-summary
  engram_write_readback: not-run
  issue_211_status: blocked-for-write-readback
non_goals:
  - executing live Discord messages
  - proving live Engram write/readback
  - storing private topology in git
  - claiming production readiness
  - closing issue 211
