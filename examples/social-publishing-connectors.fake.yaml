    scheduling_support: provider-specific
    ledger_update_behavior: normalized-success-result-only
approval_contract:
  draft_approval_phrase: approve draft
  schedule_approval_phrase: approve schedule
  publish_approval_phrase: approve publish
  draft_approval_allows_publish: false
  schedule_approval_allows_publish: false
  publish_requires_explicit_separate_approval: true
  publish_before_approval_blocked: true
  schedule_before_approval_blocked: true
  ledger_updates_before_provider_success: false
ledger_contract:
  allowed_initial_states:
    - draft
    - queued
  publish_success_state: published
  schedule_success_state: queued
  failed_result_preserves_previous_state: true
  blocked_result_preserves_previous_state: true
  provider_receipts_are_fake_only: true
  publish_receipt_prefix: fake-provider://publish/
  schedule_receipt_prefix: fake-provider://schedule/
credential_requirements:
  storage_classification: private-runtime-only
  placeholders_only: true
  public_repo_allowed_values:
    - example.invalid
    - placeholder
    - fake-provider://publish/
    - fake-provider://schedule/
  required_rotation_actions:
    - revoke-provider-token
    - rotate-secret
    - rebind-private-runtime-account
    - invalidate-old-session-state
    - rerun-fake-first-validator
scenarios:
  - name: blocked-publish-before-approval
    intent: publish
    draft_approved: false
    schedule_approved: false
    publish_approved: false
    action_allowed: false
    expected_result: blocked-before-approval
    provider_call_attempted: false
    live_activity_attempted: false
    ledger_before:
      entry_id: social-post-001-demo
      status: draft
      published_at: unknown
      scheduled_for: unknown
      provider_receipt_ref: none
    provider_result:
      status: not-attempted
      receipt_ref: none
      completed_at: null
      scheduled_for: null
      error_ref: null
    ledger_after:
