    decision_state: rejected
    actor_ref: operator-demo
    actor_role: maintainer-demo
    runtime_namespace: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
    route:
      project_slug: egdev
      network_slug: linkedin
    target:
      artifact_type: runtime_capability
      subtype: capability_config
      operation: update
      persistence_target: private-runtime
      target_ref: capability:filesystem
      target_namespace: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
    approval:
      required: true
      gate: discord-approval-gate
      accepted_phrase: none
      decision: reject
    provenance:
      source: discord-effective-runtime-resolver
      classification_ref: examples/discord-runtime-orchestrator.fake.yaml#runtime-capability-filesystem
      resolver_ref: examples/discord-effective-runtime-resolver.fake.yaml#filesystem-capability-blocked
      sanitized_input_summary: fake request to enable scoped filesystem capability
    validation:
      command_ref: scripts/validate-discord-durable-change-audit.sh
      result: passed-demo
    rollback:
      restore_hint: no durable write happened; keep capability disabled for scope
      rollback_scope: none
      backup_ref: none
      pre_change_snapshot_ref: none
      restore_command_ref: none
      verification_step: no restore required after rejection
      owner_ref: operator-demo
    privacy:
      raw_transcript_stored: false
      raw_discord_ids_stored: false
      private_payload_stored: false
      safe_for_repo: true
    backup:
      include_in_private_export: true
      public_repo_storage_allowed: false
non_goals:
  - live Discord validation
  - live Engram writes
  - live GitHub mutations
  - raw Discord transcripts
  - raw private profile content
  - screenshots
  - production credentials
  - publishing
  - scheduling
  - Buffer activity
