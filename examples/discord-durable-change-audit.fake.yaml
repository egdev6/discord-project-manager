    decision_state: revised
    actor_ref: operator-demo
    actor_role: maintainer-demo
    runtime_namespace: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
    route:
      project_slug: egdev
      network_slug: stack-and-flow
    target:
      artifact_type: workflow_skill
      subtype: skill_contract
      operation: draft
      persistence_target: repo
      target_ref: skills/demo-weekly-planner/SKILL.md
      target_namespace: repo
    approval:
      required: true
      gate: discord-approval-gate
      accepted_phrase: none
      decision: "revise: narrow fake skill scope"
    provenance:
      source: discord-gentle-sdd-handoff
      classification_ref: examples/discord-runtime-orchestrator.fake.yaml#workflow-skill-proposal
      resolver_ref: examples/discord-effective-runtime-resolver.fake.yaml#shared-profile-category-resolution
      sanitized_input_summary: fake request to draft a repo-backed workflow skill
    validation:
      command_ref: scripts/validate-discord-durable-change-audit.sh
      result: passed-demo
    rollback:
      restore_hint: no durable write happened; keep revised proposal response-local
      rollback_scope: none
      backup_ref: none
      pre_change_snapshot_ref: none
      restore_command_ref: none
      verification_step: revised proposal must be re-reviewed before write
      owner_ref: operator-demo
    privacy:
      raw_transcript_stored: false
      raw_discord_ids_stored: false
      private_payload_stored: false
      safe_for_repo: true
    backup:
      include_in_private_export: false
      public_repo_storage_allowed: true
  - audit_id: audit-demo-profile-restore-failed-validation
    decision_state: failed-validation
    actor_ref: operator-demo
    actor_role: maintainer-demo
    runtime_namespace: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
    route:
      project_slug: egdev
      network_slug: linkedin
    target:
      artifact_type: private_context
      subtype: profile
      operation: update
      persistence_target: private-runtime
      target_ref: profile:writing.demo-linkedin-b2b
      target_namespace: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
    approval:
      required: true
      gate: discord-approval-gate
      accepted_phrase: approve write
      decision: approve write
    provenance:
      source: discord-approval-gate
      classification_ref: examples/discord-runtime-orchestrator.fake.yaml#private-profile-create
      resolver_ref: examples/discord-effective-runtime-resolver.fake.yaml#shared-profile-category-resolution
      sanitized_input_summary: fake approved profile update failed sanitized validation
    validation:
      command_ref: scripts/validate-discord-durable-change-audit.sh
      result: failed-demo
    rollback:
      restore_hint: restore pre-change private profile snapshot and re-run sanitized readback
      rollback_scope: private-runtime-profile
      backup_ref: private-backup://demo/engram-before-profile-update.sql
      pre_change_snapshot_ref: snapshot:profile-writing-demo-linkedin-b2b-before-update
      restore_command_ref: docs/security/data-handling.md#current-recovery-path
      verification_step: compare sanitized effective resolution before enabling writes
