schema_version: 1
fixture_type: fake-demo
safe_for_repo: true
privacy_reviewed: true
contract: runtime-approval-enforcement-repair
issue: 211
live_discord_connection: false
live_engram_calls: false
live_openclaw_prompt_execution: false
runtime_enforcement_proven: false
uses_real_discord_ids: false
raw_discord_chat_logs_included: false
raw_private_payload_included: false
screenshots_included: false
secrets_included: false
repair_design_status: design-only-not-implemented
readiness_gate_updated: false
runtime_namespace_contract: discord-project-manager/runtime/discord/<guild-id>/<channel-id>
source_contracts:
  - skills/discord-approval-gate/SKILL.md
  - docs/operations/discord-approval-responses.md
  - examples/discord-approval-gate.fake.yaml
  - examples/private-discord-engram-rehearsal-readiness.fake.yaml
  - examples/private-discord-engram-noop-observation.fake.yaml
problem_statement:
  known_failure: write-like private Discord pilot created runtime workspace files before explicit approve write
  required_repair: runtime must enforce approval before any prompt execution or persistence tool call for write-like Discord-originated requests
  proof_status: not-proven
pre_approval_enforcement:
  write_like_detection_required: true
  triggers:
    - save
    - write
    - update
    - remember
    - store
    - queue
    - ledger
    - publish
    - schedule
  allowed_before_approval:
    - classify request
    - resolve route metadata
    - render response-only approval prompt
    - keep response-local audit summary
  forbidden_before_approval:
    - prompt execution
    - workspace file writes
    - filesystem writes
    - Engram writes
    - durable memory writes
    - ledger writes
    - queue writes
    - publishing
    - scheduling
    - GitHub mutations
approval_state_machine:
  initial_write_like_state: approval-requested
  exact_approval_phrase: approve write
  invalid_approval_inputs:
    - approve
    - Approve write
    - approve write please
    - emoji-reaction
    - no-reply
  invalid_inputs_write_allowed: false
  revise_state: approval-requested
  reject_state: rejected
  unmapped_route_state: needs-route
post_approval_enforcement:
  approved_write_allowed: true
  allowed_scope: displayed-target-only
  requires_prior_proposal_ref: true
  requires_sanitized_audit_record: true
  requires_rollback_restore_hint: true
  requires_unauthorized_artifact_cleanup: true
  publishing_allowed: false
  scheduling_allowed: false
  unrelated_memory_writes_allowed: false
unauthorized_write_recovery:
  recovery_required: true
  incident_state: unauthorized-workspace-artifact-created
  immediate_action: stop runtime and preserve sanitized incident metadata only
  cleanup_scope:
    - unauthorized workspace files
    - partial runtime audit records
    - partial durable memory writes if any
  cleanup_requires_operator_review: true
  restore_hint: restore previous private runtime state from private backup before resuming writes
  backup_ref: private-backup://demo/runtime-approval-before-repair.tgz
  pre_change_snapshot_ref: snapshot:runtime-approval-before-repair
  restore_command_ref: docs/security/data-handling.md#current-recovery-path
  verification_step: run sanitized no-op observation and readback checks before accepting more writes
  owner_ref: operator-demo
  fix_forward_path: repair guard, rerun approval lifecycle validator, then run separately approved no-op runtime probe

observability_contract:
  guard_denial_event_required: true
  invalid_approval_attempt_event_required: true
  guard_failure_event_required: true
  event_privacy: sanitized-metadata-only
  forbidden_event_content:
    - raw Discord IDs
    - raw transcripts
    - private payloads
    - credentials
  required_event_fields:
    - event_type
    - route_status
    - response_state
    - approval_status
    - writes_attempted
    - runtime_namespace_placeholder
    - target_namespace_ref
  operator_signal_required: true
  alert_condition: guard failure or any attempted write before approval

runtime_guard_contract:
  guard_location: openclaw-discord-entrypoint-before-runner
  must_run_before:
    - workflow skill execution
    - model prompt execution
    - file tools
    - memory tools
    - workspace persistence
  denial_response_state: approval-requested
  denial_is_successful_preview: true
  denial_must_not_throw_unhandled_error: true
repair_validation_plan:
  static_contract_validator: scripts/validate-runtime-approval-enforcement-repair.sh
  required_future_runtime_probe: separately-approved-private-or-local-no-op-probe
  fixture_only_evidence_satisfies_runtime_proof: false
  synthetic_fixture_only_satisfies_runtime_proof: false
  required_probe_observations:
    - write-like request returns approval-requested
    - invalid approval inputs do not write
    - no prompt execution occurs before approval
    - no workspace file writes occur before approval
    - no Engram/durable memory writes occur before approval
    - approved write is limited to displayed target only
    - unauthorized workspace artifacts have cleanup and restore path
    - guard denial and guard failure events emit sanitized metadata
readiness_gate_effect:
  readiness_check_id: runtime-approval-enforcement
  current_status: design-only-not-implemented
  required_future_status: available-and-proven
  updates_readiness_fixture_now: false
  readiness_fixture_ref: examples/private-discord-engram-rehearsal-readiness.fake.yaml
sanitized_evidence_policy:
  allowed:
    - design summary
    - static validator output
    - placeholder namespace refs
    - future sanitized probe pass or blocked summary
  forbidden:
    - real Discord guild/channel/user/message IDs
    - credentials or .env values
    - screenshots
    - raw logs
    - transcripts
    - private payloads
    - raw Engram exports
    - SQL dumps
non_goals:
  - implementing runtime code
  - proving runtime approval enforcement
  - executing live Discord messages
  - writing to Engram
  - updating readiness to available-and-proven
  - closing issue 211
